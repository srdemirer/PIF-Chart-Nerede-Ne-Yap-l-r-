<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>PIF Chart - Nerede Ne Yapılır ✈️</title>
    
    <!-- Google Fonts & Bootstrap 5 -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Kendi CSS Dosyası -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container my-4">
        <!-- BAŞLIK -->
        <div class="text-center mb-4">
            <h1 class="display-5 fw-bold text-primary">
                <i class="bi bi-geo-alt-fill text-danger"></i> PIF Chart - Nerede Ne Yapılır?
            </h1>
            <p class="lead text-muted">ILS, VOR veya SID chart'ı yükleyin, resme tıklayarak pin ekleyin ve notlarınızı kaydedin.</p>
        </div>

        <!-- KONTROL PANELİ -->
        <div class="row g-3 justify-content-center mb-4">
            <div class="col-md-6 col-lg-5">
                <div class="input-group">
                    <label class="input-group-text bg-primary text-white" for="imageLoader">
                        <i class="bi bi-cloud-upload"></i> Chart Yükle
                    </label>
                    <input type="file" class="form-control" id="imageLoader" accept="image/*">
                </div>
                <div class="form-text">JPG veya PNG formatında bir resim seçin.</div>
            </div>
            <div class="col-md-3 col-lg-2 d-grid">
                <button class="btn btn-outline-danger" id="resetBtn">
                    <i class="bi bi-arrow-counterclockwise"></i> Sıfırla
                </button>
            </div>
        </div>

        <!-- CHART GÖSTERİM ALANI -->
        <div id="map-container" class="position-relative mx-auto shadow-lg rounded-4 border border-2 border-primary" style="max-width: 1000px; background: #e9ecef; min-height: 400px; overflow: hidden;">
            <img id="chartImage" src="" alt="Yüklenen Chart" style="display: none; max-width: 100%; height: auto; width: 100%;">
            <!-- Pinler buraya eklenecek -->
        </div>

        <!-- BİLGİ ALANI -->
        <div id="info-area" class="mt-4 text-center text-muted">
            <i class="bi bi-info-circle"></i> Bir chart yükleyin ve resmin üzerine tıklayarak pin ekleyin.
        </div>
    </div>

    <!-- Kendi JavaScript Dosyası -->
    <script src="script.js"></script>
    
    <!-- Bootstrap JS (isteğe bağlı, bazı bileşenler için) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
